<!DOCTYPE html><html lang="si"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Browser tab එකේ පෙනෙන නම (title) මෙතනින් වෙනස් කරන්න. -->
<title>Connect 2027 – ආරම්භක උත්සවය</title>
<!-- අකුරු (Font): Google Fonts වලින් එනවා. internet නැත්නම් default font එකක් පෙන්වනවා. -->
<!-- වෙන font එකක් ඕන නම් මෙම link එකයි, CSS එකේ font-family එකයි දෙකම වෙනස් කරන්න. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@500;800&family=Poppins:wght@800&display=swap" rel="stylesheet">
<style>
/* ===== CSS (පෙනුම) ===== */
/* --bg = පසුබිම් වර්ණය, --tx = අකුරු වර්ණය (සුදු). */
:root{--bg:#07061a;--tx:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* මුළු page එකම screen එකට සීමා කරලා (scroll නැහැ). font-family = Sinhala අකුරු සඳහා Noto Sans Sinhala. */
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:'Noto Sans Sinhala','Poppins',sans-serif;color:var(--tx)}
/* පසුබිම් gradient එක. වර්ණ වෙනස් කරන්න ඕන නම් #07061a, #1a0b3a, #2a0a3a වෙනස් කරන්න. */
/* (JS එකෙන් පහන් දැල්වෙද්දී ඇතුළේ තැඹිලි පාට glow එකක් එකතු වෙනවා.) */
#bgglow{position:fixed;inset:0;background:radial-gradient(ellipse at 60% 70%,rgba(255,140,30,.0),transparent 60%),linear-gradient(135deg,#07061a,#1a0b3a 55%,#2a0a3a);transition:.4s}
/* canvas = දුම්, ගිනි පුපුරු, bokeh (පාට බුබුලු) අඳින්න තියෙන තැන, මුළු screen එකම පිරෙනවා. */
canvas{position:fixed;inset:0;width:100%;height:100%}
/* #stage = පහන තියෙන කොටස. 554px = පහන් රූපයේ ප්‍රමාණය (lamp.png එක 554x554). රූපය වෙනස් කළොත් මේකත්, JS එකේ 554 ත් වෙනස් කරන්න. */
#stage{position:fixed;width:554px;height:554px;transform-origin:0 0}
#stage canvas,#stage img{position:absolute;left:0;top:0;width:554px;height:554px}
/* #txt = වම් පැත්තේ logo + අකුරු කොටස. left = වමෙන් දුර, max-width = පළල. */
#txt{position:fixed;left:5vw;top:50%;transform:translateY(-50%);max-width:36vw;z-index:5}
/* logo එකේ ප්‍රමාණය (width) සහ වටේ pink glow (drop-shadow) මෙතනින්. */
#logo{display:block;width:min(34vw,460px);height:auto;margin-bottom:22px;filter:drop-shadow(0 0 24px #ff2ea688)}
/* ප්‍රධාන මාතෘකාව (h2) - ප්‍රමාණය font-size වලින්, වටේ glow text-shadow වලින්. */
h2{font-weight:800;font-size:clamp(17px,2.3vw,34px);line-height:1.5;margin:0 0 8px;text-shadow:0 0 20px #ff2ea6aa}
/* දෙවන මාතෘකාව (h3) - කහ පාට (#ffd36b). වර්ණය මෙතනින් වෙනස් කරන්න. */
h3{font-weight:500;font-size:clamp(15px,1.8vw,26px);margin:0;color:#ffd36b}
/* (දැනට භාවිතා නොවන animation එකක්; ඉවත් කළත් කමක් නැහැ.) */
@keyframes sh{to{background-position:300% 0}}
/* පහළ තියෙන "ඔබන්න" button එක (පහන් දැල්වීම ආරම්භ කරන්න). size = width/height, පාට = border/box-shadow. */
#key{position:fixed;bottom:4vh;left:50%;transform:translateX(-50%);border:2px solid #ffffff88;border-radius:12px;width:min(260px,50vw);height:42px;box-shadow:0 5px 0 #ffffff33,0 0 24px #00e5ff66;animation:pu 1.4s ease-in-out infinite;transition:opacity .6s;cursor:pointer;z-index:6}
/* button එක උඩ පහළ චලනය වෙන animation එක. */
@keyframes pu{50%{transform:translateX(-50%) translateY(4px);box-shadow:0 1px 0 #ffffff33,0 0 36px #ff2ea699}}
/* Phone / පටු screen (820px ට අඩු) සඳහා layout: අකුරු උඩට, පහන පහළට යනවා. */
@media(max-width:820px){#txt{left:0;right:0;top:2vh;transform:none;max-width:none;text-align:center;padding:0 14px}#logo{margin:0 auto 8px;width:62vw}}
</style></head><body>
<!-- ===== HTML (අන්තර්ගතය) ===== -->
<!-- bgglow = පසුබිම, fx = ගිනි පුපුරු/bokeh canvas. -->
<div id="bgglow"></div><canvas id="fx"></canvas>
<!-- වම් පැත්තේ logo එක: assets/logo.png. වෙන logo එකක් දාන්න ඕන නම් ඒ file එක assets folder එකේ එම නමින්ම replace කරන්න. -->
<div id="txt"><img id="logo" alt="Connect 2027" src="/logo.png">
<!-- 👇 පෙන්වන අකුරු මෙතනින් වෙනස් කරන්න: h2 = ප්‍රධාන මාතෘකාව, h3 = සංවිධානයේ නම. -->
<h2>යෞවන සමාජ පිහිටුවීම හා ප්‍රතිසංවිධානය 2027</h2><h3>ගම්පහ ප්‍රාදේශීය යෞවන සමාජ සම්මේලනය</h3></div>
<!-- පහන: assets/lamp.png (පහන් රූපය). cb = පිටුපස ඇති පහන් කබල්/ගිනි, cf = ඉදිරියෙන් ඇති ඒවා + මල්. -->
<div id="stage"><canvas id="cb"></canvas><img id="lamp" src="/lamp.png" alt=""><canvas id="cf"></canvas></div>
<!-- "ඔබන්න" button එක (Space key / tap කළත් ක්‍රියා කරනවා). -->
<div id="key"></div>
<!-- පසුබිම් සංගීතය: assets/music.mp3. වෙනත් සංගීතයක් ඕන නම් ඒ file එක music.mp3 නමින් assets එකේ replace කරන්න (හෝ src="" වෙනස් කරන්න). -->
<audio id="bgm" loop preload="auto" src="/music.mp3"></audio>
<script>
/* ===== JavaScript (ක්‍රියාකාරීත්වය) ===== */
/* $ = id එකෙන් element එක ගන්න කෙටි ක්‍රමය. TAU = රවුමක් (2π). CX = පහනේ මැද x ස්ථානය (554/2 ට ආසන්න). */
const $=id=>document.getElementById(id),TAU=Math.PI*2,CX=272;
/* canvas ටික සූදානම් කිරීම. */
const fx=$('fx'),fc=fx.getContext('2d'),cb=$('cb'),cf=$('cf'),bc=cb.getContext('2d'),ffc=cf.getContext('2d'),stage=$('stage');
/* D = screen එකේ pixel ගණන (phone එකේ පැහැදිලි රූපයට). උපරිම 2. */
const D=Math.min(2,devicePixelRatio||1);
[cb,cf].forEach(c=>{c.width=c.height=554*D});bc.scale(D,D);ffc.scale(D,D);
/* fit() = screen එකේ ප්‍රමාණයට අනුව පහන විශාල/කුඩා කිරීම සහ තැන තීරණය කිරීම. */
let W,H,sc;
function fit(){W=innerWidth;H=innerHeight;fx.width=W*D;fx.height=H*D;fc.setTransform(D,0,0,D,0,0);
/* 820 = desktop/phone වෙන් කරන පළල. wide තිබේ නම් පහන දකුණට (W*0.62), phone එකේ මැදට. */
/* H*0.97 = පහන screen උසෙන් 97%ක් වෙනවා; phone එකේ 74%. පහන විශාල/කුඩා කරන්න ඕන නම් මේ අගයන් වෙනස් කරන්න. */
 const wide=W>820;sc=wide?H*0.97/554:(H*0.74)/554;
 const top=wide?H*0.015:H*0.26-(0);stage.style.transform=`scale(${sc})`;
 stage.style.left=(wide?W*0.62:W/2)-CX*sc+'px';stage.style.top=(wide?H*0.015:H-554*sc-H*0.1)+'px';}
addEventListener('resize',fit);fit();
/* two tiers: 10 + 10 = 20 flames; base tray = flowers */
/* 🔥 පහන් තට්ටු 2ක්: cy = තට්ටුවේ උස (y), rx/ry = පහන් කබල් තැබූ රවුමේ පළල/උස, n = එක තට්ටුවක පහන් ගණන (10+10 = 20). */
/* !! n වෙනස් කළොත් පහළ තියෙන 20 (litCount===20, litCount/20) සහ 19 (hit(i) එකේ i===19) ත් ඒ අනුව වෙනස් කරන්න. */
const rings=[{cy:226,rx:46,ry:8,n:10},{cy:347,rx:46,ry:8,n:10}];
/* සෑම තට්ටුවකටම: rot = දැන් භ්‍රමණ කෝණය, tg = යා යුතු කෝණය, lit = දැල්වීමේ ප්‍රමාණය, on = දැල්වුණාද? */
rings.forEach(r=>{r.rot=Math.PI/2;r.tg=r.rot;r.lit=Array(r.n).fill(0);r.on=Array(r.n).fill(false);});
/* පහන් දැල්වෙන අනුපිළිවෙල: මුලින් උඩ තට්ටුව, ඊළඟට පහළ තට්ටුව. (මෙතන ඇණවුම වෙනස් කළ හැක) */
const order=[];rings.forEach((r,ri)=>{for(let k=0;k<r.n;k++)order.push([ri,k])});
/* idx = ඊළඟට දැල්වෙන පහන, litCount = දැල්වුණු ගණන, finale = අවසන් fireworks පටන් ගත්තාද, sparks = ගිනි පුපුරු. */
let idx=0,busy=null,sparks=[],pulses=[],finale=0,litCount=0;
/* ⭐ Space ඔබන විට / tap කරන විට: ඊළඟ පහන දැල්වීමට පහන කරකවලා, සංගීතය පටන් ගන්නවා. (පළමු වතාවෙන්ම audio ආරම්භ වෙනවා) */
function press(){
 if(busy||idx>=order.length)return;
 initAudio();const [ri,k]=order[idx];const r=rings[ri];
 let t=Math.PI/2-k*TAU/r.n;while(t-r.rot>Math.PI)t-=TAU;while(t-r.rot<-Math.PI)t+=TAU;
 if(Math.abs(t-r.rot)<0.05)t+=TAU; r.tg=t;busy={ri,k,done:false};hit(idx);idx++;$('key').style.opacity=0;setTimeout(()=>$('key').style.pointerEvents='none',600);
}
/* Space key එක ඔබන විට press() ක්‍රියාත්මක වෙනවා. වෙන key එකක් ඕන නම් e.code==="Space" වෙනස් කරන්න (උදා: "Enter"). */
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat)press();}});
$('key').onclick=press;addEventListener('touchstart',e=>{if(e.target.tagName!=='LABEL'&&e.target.tagName!=='INPUT')press()},{passive:true});
/* පහන් කබලක ස්ථානය (x,y) සහ ඉදිරියෙන්/පිටුපසින් ද කියා ගණනය කරනවා. */
function slotPos(r,i){const th=r.rot+i*TAU/r.n;return{x:CX+r.rx*Math.cos(th),y:r.cy+r.ry*Math.sin(th),d:Math.sin(th)}}
function toScreen(x,y){const b=stage.getBoundingClientRect();return[b.left+x*sc,b.top+y*sc]}

/* 🌸 පහන පාමුල මල් (flowers): canvas එකේ එක වරක් පමණක් ඇඳලා තබාගන්නවා. */
const fo=document.createElement('canvas');fo.width=fo.height=554*2;const fcx=fo.getContext('2d');fcx.scale(2,2);
(function(){let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
/* මල් පාට (එක් එකක්: [මැද පාට, අග පාට]). පාට අලුත් කරන්න හෝ එකතු කරන්න. */
 const P=[['#fff8fb','#ffb3d1'],['#ffd1e3','#e0457f'],['#ff8a7a','#b3122a'],['#fff2a8','#f29100'],['#f3e6ff','#a77bff'],['#ffffff','#f2f2f2']];
/* 34 = මල් ගණන. වැඩි/අඩු කරන්න. 272,483 = මල් අඳින මධ්‍යය (x,y); 66 = පළල. */
 const fl=[];for(let i=0;i<34;i++){const th=rnd()*TAU,f=.35+rnd()*.62,x=272+66*f*Math.cos(th),y=483+11.5*f*Math.sin(th);
  if(Math.abs(x-272)<22&&Math.sin(th)<.1)continue;fl.push({x,y,r:8+rnd()*6,p:P[i%P.length],o:rnd()*TAU,d:Math.sin(th)})}
 fl.sort((a,b)=>a.y-b.y);const c=fcx;
 fl.forEach(o=>{const r=o.r*(.85+.2*(o.d+1)/2);c.save();c.translate(o.x,o.y);c.scale(1,.6);
  c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.arc(0,r*.25,r*1.05,0,TAU);c.fill();
  for(let i=0;i<4;i++){c.save();c.rotate(o.o+i*1.6);c.fillStyle=i%2?'#2f7d32':'#3f9a3a';c.beginPath();c.ellipse(0,-r*.95,r*.3,r*.6,0,0,TAU);c.fill();c.restore()}
  const ring=(n,len,wd,off,sh)=>{for(let i=0;i<n;i++){c.save();c.rotate(o.o+off+i*TAU/n);const g=c.createLinearGradient(0,0,0,-len);g.addColorStop(0,o.p[0]);g.addColorStop(sh,o.p[0]);g.addColorStop(1,o.p[1]);
   c.fillStyle=g;c.strokeStyle='rgba(120,30,60,.35)';c.lineWidth=.5;c.beginPath();c.moveTo(0,0);c.bezierCurveTo(-wd,-len*.35,-wd*.7,-len*.85,0,-len);c.bezierCurveTo(wd*.7,-len*.85,wd,-len*.35,0,0);c.fill();c.stroke();c.restore()}};
  ring(9,r,r*.42,0,.35);ring(7,r*.78,r*.4,.35,.45);ring(5,r*.5,r*.3,.2,.6);
  c.fillStyle='#ffc21a';c.beginPath();c.arc(0,0,r*.14,0,TAU);c.fill();c.fillStyle='#e07b00';for(let i=0;i<6;i++){c.beginPath();c.arc(Math.cos(i)*r*.2,Math.sin(i)*r*.2,r*.04,0,TAU);c.fill()}
  c.restore()});})();
/* 🔥 ගිනිදැල අඳින function: x,y = ස්ථානය, s = ප්‍රමාණය, a = දීප්තිය. 30 = ගිනිදැලේ උස, 9 = පළල. වර්ණ (#ffe9a0, #ffb21e...) වෙනස් කළ හැක. */
function flame(c,x,y,s,a,t,ph){
 const h=30*s*a,w=9*s*a,sw=Math.sin(t*7+ph)*2.2*s+Math.sin(t*13+ph*2)*1.2*s,fl=1+Math.sin(t*19+ph)*.08;
 c.save();c.globalCompositeOperation='lighter';
 let g=c.createRadialGradient(x,y-h*.4,1,x,y-h*.4,48*s*a);g.addColorStop(0,'rgba(255,170,50,.55)');g.addColorStop(1,'rgba(255,90,0,0)');c.fillStyle=g;c.fillRect(x-60,y-h-60,120,120+h);
 c.restore();
 const hh=h*fl;c.beginPath();c.moveTo(x,y);c.bezierCurveTo(x-w*1.3,y-hh*.3,x-w*.5,y-hh*.7,x+sw,y-hh);c.bezierCurveTo(x+w*.5,y-hh*.7,x+w*1.3,y-hh*.3,x,y);
 g=c.createLinearGradient(0,y,0,y-hh);g.addColorStop(0,'#3a6bff');g.addColorStop(.12,'#ffe9a0');g.addColorStop(.45,'#ffb21e');g.addColorStop(1,'rgba(255,70,0,.85)');c.fillStyle=g;c.fill();
 c.beginPath();c.ellipse(x+sw*.2,y-hh*.28,w*.28,hh*.2,0,0,TAU);c.fillStyle='rgba(255,255,255,.85)';c.fill();
}
/* පහන් කබල (තෙල් කෝප්පය) සහ තිරය අඳින function. #c8901f = කබලේ පාට. */
function cup(c,x,y,s,lit){c.beginPath();c.ellipse(x,y+1*s,6.5*s,3*s,0,0,TAU);c.fillStyle='#3b2606';c.fill();c.beginPath();c.ellipse(x,y,5.5*s,2.2*s,0,0,TAU);c.fillStyle=lit?'#ffcb5a':'#c8901f';c.fill();
 c.fillStyle='#1c1206';c.fillRect(x-.6*s,y-3.5*s,1.2*s,3.5*s);}
/* ගිනි පුපුරු (sparks) නිපදවීම: n = ගණන, big = fireworks සඳහාද. පාට ලැයිස්තුව මෙතන. */
function spawn(x,y,n,big){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=(big?2+Math.random()*7:1+Math.random()*3);sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(big?0:1.5),l:1,c:['#00e5ff','#ff2ea6','#ffb300','#fff','#9b5cff'][i%5],s:big?2.5:2})}}
/* bok = පසුබිමේ පාට බුබුලු (bokeh) 40ක්. length:40 වෙනස් කරලා ගණන අඩු/වැඩි කරන්න. */
let last=performance.now(),bok=Array.from({length:40},()=>({x:Math.random(),y:Math.random(),r:6+Math.random()*28,v:.01+Math.random()*.03,c:['#00e5ff','#ff2ea6','#ffb300','#9b5cff'][Math.random()*4|0],p:Math.random()*9}));
/* 🎬 මෙය තත්පරයට 60 වතාවක් ක්‍රියාත්මක වෙන ප්‍රධාන animation loop එකයි. සියල්ල (පහන්, ගිනි, glow, fireworks) මෙතනින් අඳිනවා. */
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
/* පහන කරකැවීම. 4.2 = කරකැවෙන වේගය (වැඩි = වේගවත්). සියලු 20 දැල්වුණාම finale (fireworks) පටන් ගන්නවා. */
/* setTimeout(...,350) = ඊළඟ පහන ඔබන්න පෙර ඇති පරතරය (ms). */
 rings.forEach((r,ri)=>{const d=r.tg-r.rot;r.rot+=d*Math.min(1,dt*4.2);
  if(busy&&busy.ri===ri&&!busy.done&&Math.abs(d)<0.02){busy.done=true;r.on[busy.k]=true;litCount++;const p=slotPos(r,busy.k);const[sx,sy]=toScreen(p.x,p.y-12);spawn(sx,sy,46,false);pulses.push({x:sx,y:sy,r:10,l:1});
   if(litCount===20){finale=1;ftime=0}setTimeout(()=>busy=null,350);}
  r.lit=r.lit.map((v,i)=>r.on[i]?Math.min(1,v+dt*1.6):v);});
/* පහන් කබල් සහ ගිනිදැල් ඇඳීම (පිටුපස ඒවා පොඩ්ඩක් අඳුරුයි: alpha .8). */
 bc.clearRect(0,0,554,554);ffc.clearRect(0,0,554,554);
 rings.forEach((r,ri)=>{for(let i=0;i<r.n;i++){const p=slotPos(r,i),s=.8+.3*(p.d+1)/2,c=p.d<0?bc:ffc;
  c.globalAlpha=p.d<0?.8:1;cup(c,p.x,p.y,s,r.lit[i]>0);if(r.lit[i]>0)flame(c,p.x,p.y-2,s,r.lit[i],t,i*1.7+ri*3);c.globalAlpha=1;}});
 ffc.drawImage(fo,0,0,554,554);
/* පහන් වැඩි වන තරමට පසුබිමේ තැඹිලි glow එක වැඩි වෙනවා. .35 = උපරිම glow ප්‍රමාණය. */
 $('bgglow').style.background=`radial-gradient(ellipse at ${W>820?62:50}% 60%,rgba(255,140,30,${litCount/20*.35}),transparent 60%),linear-gradient(135deg,#07061a,#1a0b3a 55%,#2a0a3a)`;
/* පසුබිම් bokeh බුබුලු සහ පහන දැල්වෙද්දී පෙනෙන වළලු (pulses) ඇඳීම. */
 fc.clearRect(0,0,W,H);fc.globalCompositeOperation='lighter';
 bok.forEach(b=>{b.y-=b.v*dt;if(b.y<-.1)b.y=1.1;fc.globalAlpha=.07+.05*Math.sin(t+b.p)+litCount/20*.06;fc.fillStyle=b.c;fc.beginPath();fc.arc(b.x*W+Math.sin(t*.3+b.p)*20,b.y*H,b.r,0,TAU);fc.fill();});
 fc.globalAlpha=1;
 pulses=pulses.filter(p=>{p.r+=dt*320;p.l-=dt*1.5;if(p.l<=0)return false;fc.strokeStyle=`rgba(255,${120+p.l*100|0},60,${p.l})`;fc.lineWidth=3;fc.beginPath();fc.arc(p.x,p.y,p.r,0,TAU);fc.stroke();return true});
/* 🎆 අවසාන fireworks: ftime<8 = තත්පර 8ක් පුරා. Math.random()<dt*5 = තත්පරයට ~5ක්. 70 = එක් පිපිරීමකට පුපුරු ගණන. */
 if(finale){ftime+=dt;if(ftime<8&&Math.random()<dt*5){const x=W*(.1+Math.random()*.8),y=H*(.1+Math.random()*.45);spawn(x,y,70,true);burstSound()}}
 sparks=sparks.filter(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=.06;s.vx*=.985;s.l-=dt*.8;if(s.l<=0)return false;fc.globalAlpha=s.l;fc.fillStyle=s.c;fc.beginPath();fc.arc(s.x,s.y,s.s*s.l+.5,0,TAU);fc.fill();return true});
 fc.globalCompositeOperation='source-over';fc.globalAlpha=1;requestAnimationFrame(frame);}
let ftime=0;requestAnimationFrame(frame);
/* ===== 🎵 සංගීතය (Sound) ===== */
/* දැන් assets/music.mp3 file එක වාදනය වෙනවා. පහන දැල්වෙද්දී bell ශබ්දයක් පමණක් ඒ උඩට එකතු වෙනවා. */
/* (පහත "synthesised" කොටස music file එක නැති නම් පාවිච්චි කරන drum/reed සංගීතයයි.) */
/* ---------- Kandyan-style sound (synthesised; drop an audio file on the page to use your own) ---------- */
/* ac = AudioContext, custom = <audio id="bgm"> element එක (music.mp3). volume = custom.volume (0 - 1). */
let ac,mg,custom=$('bgm'),loopT=null,step=0;
const NOTE=m=>440*Math.pow(2,(m-69)/12),SC=[62,63,65,67,69,70,72,74,75,77,79,81];
/* පළමු ඔබන්නෙන් audio පටන් ගන්නවා (browser එකේ නීතිය නිසා user click එකකින් පසු පමණක් audio ක්‍රියා කරනවා). custom.volume=.9 -> ශබ්දය වෙනස් කරන්න. */
function initAudio(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.8;mg.connect(ac.destination);
 if(custom){custom.loop=true;custom.volume=.9;custom.play().catch(()=>{});return}
 [38,45,50].forEach((m,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=NOTE(m);g.gain.value=.05;o.connect(g).connect(mg);o.start()});
 loopT=setInterval(()=>{drumStep(ac.currentTime+.05,step++)},215);}
function noiseBuf(){if(noiseBuf.b)return noiseBuf.b;const b=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return noiseBuf.b=b}
function thum(t,f,v){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(f*1.6,t);o.frequency.exponentialRampToValueAtTime(f,t+.08);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g).connect(mg);o.start(t);o.stop(t+.4)}
function slap(t,v,f){const s=ac.createBufferSource(),b=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noiseBuf();b.type='bandpass';b.frequency.value=f;b.Q.value=1.4;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);s.connect(b).connect(g).connect(mg);s.start(t);s.stop(t+.12)}
function drumStep(t,i){const p=['T','t','k','t','D','t','k','k'][i%8];if(p==='D'||p==='T'){thum(t,p==='T'?95:80,.55);}if(p==='k'){slap(t,.22,2600)}if(p==='t'){slap(t,.12,1500);}if(i%16===8)slap(t,.25,4200)}
function reed(t,m,len,v){const o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain();o.type='sawtooth';o.frequency.value=NOTE(m);f.type='bandpass';f.frequency.value=1500;f.Q.value=2.5;l.frequency.value=5.5;lg.gain.value=NOTE(m)*.012;l.connect(lg).connect(o.frequency);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.05);g.gain.setValueAtTime(v,t+len*.8);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(f).connect(g).connect(mg);o.start(t);l.start(t);o.stop(t+len+.05);l.stop(t+len+.05)}
function bell(t,m,v,len){const b=ac.createOscillator(),g=ac.createGain();b.type='sine';b.frequency.value=NOTE(m);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+len);b.connect(g).connect(mg);b.start(t);b.stop(t+len+.1)}
/* සෑම පහනක් දැල්වෙද්දීම ඇසෙන bell ශබ්දය. i===19 (අවසාන පහන) විට විශේෂ bell chord එකක් වාදනය වෙනවා. */
function hit(i){if(!ac)return;if(custom){const t=ac.currentTime+.02;bell(t,86,.1,1.6);bell(t+.02,98,.05,1.2);if(i===19)[79,83,86,91].forEach((m,j)=>bell(t+.2+j*.18,m,.1,2.4));return}const t=ac.currentTime+.02;
 for(let k=0;k<6;k++)slap(t+k*.05,.2,2200+k*300);thum(t+.3,90,.7);
 const base=[0,2,4,3,5,7,5,4,2,0,2,4,7,5,9][i%15],ph=[[0,1,2,1],[2,3,4,2],[4,3,2,1,0]][i%3];
 ph.forEach((d,j)=>reed(t+.35+j*.28,SC[Math.min(11,base+d)],.3,.07));
 const b=ac.createOscillator(),g=ac.createGain();b.type='sine';b.frequency.value=NOTE(86);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+1.6);b.connect(g).connect(mg);b.start(t);b.stop(t+1.7);
 if(i===19)setTimeout(()=>{for(let k=0;k<30;k++){thum(ac.currentTime+k*.09,90,.5);slap(ac.currentTime+k*.09,.2,2500)}[0,2,4,7].forEach((d,j)=>reed(ac.currentTime+j*.35,SC[d+3],1.8,.09))},1200)}
function burstSound(){if(!ac||custom)return;const t=ac.currentTime;slap(t,.35,900);thum(t,60,.5)}
/* (අමතර) වෙනත් audio file එකක් page එකට drag & drop කළොත් ඒ file එක ක්ෂණිකව සංගීතය ලෙස වාදනය වෙනවා. */
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('audio')){custom.src=URL.createObjectURL(f);if(ac){custom.play().catch(()=>{})}}});
</script></body></html>
